# Deploy Vite SPA to GitHub Pages (project site: /osakatrip/)
# No custom secrets — uses the default GITHUB_TOKEN + Pages OIDC.
#
# Repo setup (once): Settings → Pages → Build and deployment → Source: GitHub Actions
# If deploy fails with HTTP 404 "Ensure GitHub Pages has been enabled", turn on
# Pages (Actions) then re-run this workflow (Actions → Deploy GitHub Pages → Run workflow).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
